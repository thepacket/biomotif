# nginx's add_header does not inherit into a block that declares its own, so
# these are included per-location rather than set once on the server.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;

# The app talks to nothing at runtime. Sequences are read from a local file or
# pasted in, and every search runs in the page, so connect-src is closed
# entirely rather than set to 'self'. That is also what makes the deployment
# private by construction: a sequence cannot leave the browser.
#
# The one third party is Google Fonts, which serves the stylesheet from
# fonts.googleapis.com and the woff2 files from fonts.gstatic.com. Every face
# has a real fallback stack, so blocking them costs typography and nothing else.
#
# script-src and style-src are both 'self' with no 'unsafe-inline': the deployed
# build emits the bundle and the stylesheet as separate fingerprinted files, and
# the page never writes a style attribute — the sequence track colours bases with
# classes, so the whole of it stays under the policy.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
