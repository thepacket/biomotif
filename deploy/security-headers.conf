# nginx's add_header does not inherit into a block that declares its own, so
# these are included per-location rather than set once on the server.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;

# connect-src is the exact list of hosts the page can reach, and nothing else:
# four sequence databases — NCBI E-utilities, Ensembl, the ENA browser at EBI and
# UniProt — plus openrouter.ai for the assistant. Every one was checked to send
# Access-Control-Allow-Origin, because the page has no server to proxy through.
#
# What that does and does not promise. A request is made only when you press
# Fetch or Search, and it carries only what is in that box — an accession, a
# gene symbol, a region, a search term. A sequence you paste or open from a file
# is never sent anywhere: matching runs entirely in the page, and 'self' is not
# in this list, so the page cannot post it back to its own origin either. The
# assistant is the one thing that sends text you typed, and only what is in the
# ask box: an OpenRouter key stays in sessionStorage and goes nowhere but
# openrouter.ai. But
# connect-src is a list of hosts, not a rule about content, so it constrains
# where a request may go and not what it may contain. The guarantee is the short
# host list plus the code, not the policy alone.
#
# Google Fonts is the other third party, serving the stylesheet from
# fonts.googleapis.com and the woff2 files from fonts.gstatic.com. Every face
# has a real fallback stack, so blocking them costs typography and nothing else.
#
# worker-src 'self' is the service worker that keeps the page for use offline;
# it caches only the page's own three files and passes everything else through.
#
# script-src and style-src are both 'self' with no 'unsafe-inline': the deployed
# build emits the bundle and the stylesheet as separate fingerprinted files, and
# the page never writes a style attribute — the sequence track colours bases with
# classes, so the whole of it stays under the policy.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; worker-src 'self'; connect-src https://eutils.ncbi.nlm.nih.gov https://rest.ensembl.org https://www.ebi.ac.uk https://rest.uniprot.org https://openrouter.ai; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
