server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fly terminates TLS in front of this, so a redirect built from the
    # connection's scheme would send clients back to http.
    absolute_redirect off;

    # The bundle is a third of a megabyte of JavaScript, most of it the motif
    # library as text, which compresses to roughly a tenth of that.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # build_web.py fingerprints the stylesheet and the bundle by content hash,
    # so those are safe to pin forever; index.html must not be, or a deploy
    # never reaches a browser that already has the page.
    location ~* \.(?:css|js)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # The service worker is fetched by its fixed name and must never be
    # pinned, or a new build would not reach a browser that has the old one.
    # An exact-match location outranks the regular expression above.
    #
    # It carries its own policy, not the page's: a worker's fetches answer to
    # the policy its script was served with, and the page's connect-src leaves
    # out 'self' on purpose. The worker needs exactly 'self' and nothing else,
    # so this is the tightest policy that lets it fill its cache.
    location = /sw.js {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; connect-src 'self'" always;
        add_header Cache-Control "no-cache" always;
    }

    # There are no routes: any path lands on the one page. try_files re-enters
    # the location above, so the page keeps its own headers however it was reached.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
