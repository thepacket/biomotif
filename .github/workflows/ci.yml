name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Test
        run: npm test
      - name: Build
        run: npm run dist
      - name: The committed page is current
        run: git diff --exit-code -- web/biomotif.html
      - name: The example data is reproducible
        run: |
          npm run data
          git diff --exit-code -- data/
      - name: The library index is current
        run: |
          npm run index
          git diff --exit-code -- docs/
