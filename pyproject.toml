[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motif-lisp"
version = "0.1.0"
description = "A small Lisp for pattern matching over DNA, RNA and protein sequences, with a motif library."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Andre Paquette" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
motif = "motif.cli:main"

[tool.setuptools.packages.find]
include = ["motif*"]

[tool.setuptools.package-data]
motif = ["lib/*.mtf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
